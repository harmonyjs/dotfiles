# Tmux configuration
# Author: harmonyjs
# Features: Catppuccin theme, vim-style navigation, smart splits
# Repository: https://github.com/harmonyjs/dotfiles

##### META #########################################################
set -gq _last_loaded_config "~/.tmux.conf"   # Track config load status

##### BASE #########################################################
# Use Ctrl+Space as prefix (instead of default Ctrl+b)
set -g prefix C-Space
unbind C-b
bind   C-Space send-prefix                  # Double prefix sends to app

# Enable mouse support for selecting panes, scrolling, resizing
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"          # Enable true color support
set -g alternate-screen on                  # Allow apps to use alternate screen

##### SCROLL (copy‑mode‑vi) ###################################################
# Mouse wheel scrolling in copy mode
bind -T copy-mode-vi WheelUpPane   send -X halfpage-up
bind -T copy-mode-vi WheelDownPane send -X halfpage-down


##### NAVIGATION ###############################################################
# Vim-style pane navigation (no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Alt + Arrow keys for pane navigation
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Shift + Arrow keys for window switching
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt + h/l for window switching (vim-style)
bind -n M-h     previous-window
bind -n M-l     next-window

##### COPY MODE ###############################################################
# Use vi keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel

##### SPLIT ####################################################################
# Split windows while preserving current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

##### PLUGINS ##################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

set -g @catppuccin_flavour 'latte'

run '~/.tmux/plugins/tpm/tpm'

##### NUMBERING (after plugins to override tmux-sensible) #####################
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
