# ====================
# Базовые настройки терминала
#
# https://tmuxcheatsheet.com/
#
# ====================

# Включаем поддержку true color (24-bit) для терминалов xterm
# Это позволяет отображать больше цветов и делает визуальное оформление более приятным
set-option -sa terminal-overrides ",xterm*:Tc"

# Включаем поддержку мыши
# Позволяет использовать мышь для выбора панелей, прокрутки и изменения размера окон
set -g mouse on

# Включаем поддержку скроллинга с помощью колеса мыши
setw -g alternate-screen on
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# ====================
# Настройка клавиши префикса
# ====================

# Отключаем стандартный префикс Ctrl+b
unbind C-b
# Устанавливаем новый префикс Ctrl+Space
set -g prefix C-Space
# Настраиваем отправку префикса в приложение при двойном нажатии
bind C-Space send-prefix

# ====================
# Vim-стиль навигации между панелями
# ====================

# Используем клавиши hjkl (как в Vim) для перемещения между панелями
# h - влево, j - вниз, k - вверх, l - вправо
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# ====================
# Настройка нумерации окон и панелей
# ====================

# Начинаем нумерацию окон и панелей с 1, а не с 0
# Это более интуитивно, так как на клавиатуре цифры начинаются с 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Автоматически перенумеровываем окна при закрытии одного из них
set-option -g renumber-windows on

# ====================
# Горячие клавиши для навигации без префикса
# ====================

# Alt + стрелки для переключения между панелями без использования префикса
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + стрелки для переключения между окнами
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt + H/L для переключения между окнами (альтернативный способ)
bind -n M-H previous-window
bind -n M-L next-window
# ====================
# Настройка темы и плагинов
# ====================

# Устанавливаем тему Catppuccin в варианте 'latte'
set -g @catppuccin_flavour 'latte'

# Список используемых плагинов:
set -g @plugin 'tmux-plugins/tpm'                   # Менеджер плагинов для tmux
set -g @plugin 'tmux-plugins/tmux-sensible'         # Базовые настройки tmux
set -g @plugin 'christoomey/vim-tmux-navigator'     # Интеграция навигации с Vim
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'    # Тема оформления Catppuccin
set -g @plugin 'tmux-plugins/tmux-yank'             # Улучшенное копирование текста

# Запускаем менеджер плагинов
run '~/.tmux/plugins/tpm/tpm'

# ====================
# Настройка режима Vi
# ====================

# Включаем режим Vi для копирования текста
set-window-option -g mode-keys vi

# Настройка клавиш для работы с буфером обмена в режиме Vi:
# v - начать выделение
# C-v - выделение прямоугольником
# y - скопировать и выйти из режима выделения
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ====================
# Разделение окна
# ====================

# Разделение окна с сохранением текущей директории:
# Префикс + " - разделить горизонтально
# Префикс + % - разделить вертикально
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
