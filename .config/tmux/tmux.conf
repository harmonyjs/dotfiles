# Tmux configuration
# Author: harmonyjs
# Features: Catppuccin theme, vim-style navigation, smart splits
# Repository: https://github.com/harmonyjs/dotfiles

##### META #########################################################
set -gq _last_loaded_config "~/.config/tmux/tmux.conf"   # Track config load status

##### BASE #########################################################
# Use Ctrl+Space as prefix (instead of default Ctrl+b)
set -g prefix C-Space
unbind C-b
bind   C-Space send-prefix                  # Double prefix sends to app

# Enable mouse support for selecting panes, scrolling, resizing
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"          # Enable true color support
set -g alternate-screen on                  # Allow apps to use alternate screen

##### SCROLL (copy‑mode‑vi) ###################################################
# Mouse wheel scrolling in copy mode
bind -T copy-mode-vi WheelUpPane   send -X halfpage-up
bind -T copy-mode-vi WheelDownPane send -X halfpage-down


##### NAVIGATION ###############################################################
# Vim-style pane navigation (no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Shift + Arrow keys for window switching
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt + h/l for window switching (vim-style)
bind -n M-h     previous-window
bind -n M-l     next-window

##### COPY MODE ###############################################################
# Use vi keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel

##### SPLIT ####################################################################
# Split windows while preserving current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

##### PLUGINS ##################################################################
# Set theme BEFORE loading TPM to avoid race condition on startup
set -g @catppuccin_flavor 'latte'

# Smart window naming: use window name set by zsh precmd/preexec hooks
# Shows: ~/path/to/dir for shells, "command args" for running apps
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# TPM - Tmux Plugin Manager
# Manages installation and loading of tmux plugins
# Repository: https://github.com/tmux-plugins/tpm
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'

# Tmux Sensible - Basic tmux settings everyone can agree on
# Provides sensible default settings for tmux (improved defaults)
# Repository: https://github.com/tmux-plugins/tmux-sensible
# Features: improved scrolling, better key bindings, UTF-8 support
set -g @plugin 'tmux-plugins/tmux-sensible'

# Tmux Yank - Copy to system clipboard in tmux
# Enables copying tmux buffer to system clipboard (macOS/Linux/Windows)
# Repository: https://github.com/tmux-plugins/tmux-yank
# Usage: In copy mode, press 'y' to copy selection to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin Theme - Soothing pastel theme for tmux
# Beautiful, modern theme with multiple flavours (latte/frappe/macchiato/mocha)
# Repository: https://github.com/catppuccin/tmux
# Flavours: latte (light), frappe (dark), macchiato (darker), mocha (darkest)
set -g @plugin 'catppuccin/tmux'

##### STATUS LINE ##############################################################
# Configure status line with uptime module
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_uptime}"

##### NUMBERING (after plugins to override tmux-sensible) #####################
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### TPM INITIALIZATION (must be at the very bottom) #########################
# Set PATH for macOS Homebrew to ensure TPM can find all tools
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Initialize TPM - THIS MUST BE THE LAST LINE IN THIS FILE
run '~/.tmux/plugins/tpm/tpm'
